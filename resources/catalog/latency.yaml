name: latency

category: PERFORMANCE

meaning: >-
  요청을 보낸 뒤 응답을 받기까지 걸리는 시간. 한 건의 처리에 걸리는 시간이며,
  같은 시간에 몇 건을 처리하는지는 throughput이 다룬다.

important_when:
  - 사용자가 결과를 기다리는 동안 다른 일을 진행할 수 없는 기능
  - 검색, 조회, 피드처럼 상호작용 중 발생하는 요청
  - 여러 단계를 거쳐야 응답이 완성되어 각 단계의 대기가 누적되는 경로
  - 꼬리 지연이 사용자 체감을 좌우하는 대규모 요청

examples:
  - p95 < 500ms
  - p99 < 2s
  - 전송 후 1초 이내 수신자 도달

common_tradeoffs:
  - against: throughput
    reason: >-
      여러 요청을 모아 한 번에 처리하면 자원 효율은 오르지만,
      모으는 동안 기다려야 해서 개별 요청의 응답이 늦어진다.
  - against: consistency
    reason: >-
      최신 값을 보장하려고 여러 복제본의 확인을 기다리면 네트워크 왕복이 늘어 응답이
      느려진다. 가까운 복제본이나 캐시에서 바로 읽으면 빠르지만 최신성을 보장하기 어렵다.
  - against: cost
    reason: >-
      서버, 캐시, 엣지 로케이션을 늘리거나 여유 용량을 확보하면 지연을 줄일 수 있지만
      비용이 늘어난다.
