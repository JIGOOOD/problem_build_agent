name: availability

category: RELIABILITY

meaning: >-
  요청을 받아 정상적으로 응답할 수 있는 상태로 유지되는 비율.
  결과적으로 서비스를 사용할 수 있었는지를 다루며,
  장애를 견디거나 복구하는 설계 능력 자체는 fault_tolerance가 다룬다.

important_when:
  - 중단이 곧 매출 손실이나 안전 문제로 이어지는 서비스
  - 사용자가 대체 수단 없이 그 기능에 의존하는 경우
  - 일부 구성 요소의 장애가 전체 차단으로 번질 수 있는 구조
  - 배포나 점검 중에도 서비스를 멈출 수 없는 경우

examples:
  - 99.99%
  - 월 다운타임 5분 이내
  - 한 지역 전체 장애에도 서비스 지속

common_tradeoffs:
  - against: consistency
    reason: >-
      네트워크 분단 중에 최신성을 지키려면 일부 요청을 거절하거나 대기시켜야 한다.
      계속 받아들이면 복제본끼리 잠시 다른 값을 가질 수 있다.
  - against: cost
    reason: >-
      다중 가용영역과 리전, 대기 인스턴스, 여분 복제본을 유지할수록
      장애 중에도 서비스할 수 있지만 비용이 늘어난다.
