name: throughput

category: PERFORMANCE

meaning: >-
  단위 시간에 처리하는 작업의 양. 한 건의 빠르기가 아니라 전체 처리 능력을 다루며,
  개별 요청의 응답 시간은 latency가 다룬다.

important_when:
  - 요청이 짧은 시간에 몰리거나 대량으로 지속 유입되는 경로
  - 로그, 이벤트, 지표처럼 생성량이 사용자 수보다 빠르게 커지는 데이터
  - 여러 건을 묶어 처리하면 자원 효율이 크게 오르는 작업
  - 처리 속도가 유입 속도를 따라가지 못하면 적체가 쌓이는 파이프라인

examples:
  - 초당 100만 이벤트 수집
  - 하루 10TB 적재
  - 초당 5만 건 쓰기

common_tradeoffs:
  - with: latency
    reason: >-
      일괄 처리와 버퍼링은 처리 효율을 높이지만 개별 작업을 대기시켜
      응답 시간을 늘린다.
  - with: consistency
    reason: >-
      모든 쓰기를 순서대로 직렬화하거나 여러 복제본의 동의를 기다리면
      동시에 처리할 수 있는 양이 제한된다.
  - with: cost
    reason: >-
      워커, 파티션, 샤드를 늘리면 처리량을 높일 수 있지만 비용이 늘어난다.
