name: scalability

category: SCALABILITY

meaning: >-
  부하나 데이터가 늘어날 때 자원을 늘려 처리 범위를 넓힐 수 있는 성질.
  지금의 처리 속도가 아니라, 규모가 커졌을 때 늘릴 수 있는 구조인지를 다룬다.

important_when:
  - 사용자나 데이터의 증가가 단일 노드의 용량을 넘어설 것으로 예상되는 경우
  - 부하가 특정 대상에 쏠릴 수 있는 구조 (인기 사용자, 대형 채널, 인기 상품)
  - 작업을 나누려면 분할 기준을 먼저 정해야 하는 경우
  - 한 처리 주체의 용량 한계가 전체 시스템의 확장을 제한하는 경우

examples:
  - 동시 접속 500만
  - 파티션 추가로 선형 확장
  - 샤드당 담당 범위를 나눠 부하 분산

common_tradeoffs:
  - with: consistency
    reason: >-
      분할과 복제로 확장할수록 데이터가 여러 노드에 흩어져,
      모든 노드에서 같은 상태를 즉시 유지하기 위한 조정 비용이 커진다.
  - with: latency
    reason: >-
      분할하면 용량은 늘지만 샤드 간 조회와 네트워크 홉이 생긴다.
      반대로 과부하가 풀려 지연이 줄기도 하므로 항상 상충하지는 않는다.
  - with: cost
    reason: >-
      노드, 파티션, 복제본을 늘릴수록 처리 범위는 넓어지지만 비용이 늘어난다.
