name: fault_tolerance

category: RELIABILITY

meaning: >-
  구성 요소나 네트워크에 장애가 발생해도 시스템이 요구되는 기능을 계속 수행하거나
  허용 가능한 수준으로 복구할 수 있는 능력.
  availability가 결과적으로 서비스를 쓸 수 있었는지를 본다면,
  여기서는 장애가 그 실패로 이어지지 않게 하는 설계를 다룬다.

important_when:
  - 일부 노드나 네트워크의 장애가 정상 운영 중에도 발생한다고 가정해야 하는 분산 구조
  - 수락 응답을 돌려준 뒤 실패하면 사용자가 손해를 보는 작업 (결제, 주문, 메시지)
  - 복구 과정의 재시도나 재전달이 중복 반영을 만들 수 있는 경로
  - 한 구성 요소의 실패가 전체 기능 중단으로 번질 수 있는 구조

examples:
  - 노드 1대 장애에도 서비스 지속
  - 리더 장애 시 자동 failover
  - at-least-once 전달 + 수신 측 멱등 처리

common_tradeoffs:
  - against: latency
    reason: >-
      동기 복제나 디스크 기록, 정족수 확인을 마친 뒤 성공으로 처리하면
      장애에 강해지지만 응답 시간이 늘어난다.
  - against: throughput
    reason: >-
      복제, 체크포인트, 합의에 자원이 쓰여 같은 자원으로 처리할 수 있는
      실제 작업량이 줄어든다.
  - against: cost
    reason: >-
      복제본, 백업, 대기 용량을 유지해야 하므로 비용이 늘어난다.
