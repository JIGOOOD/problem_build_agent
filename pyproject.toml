[project]
name = "archgen"
version = "0.1.0"
description = "시스템 디자인 면접 문제 및 루브릭 생성 에이전트"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "textual>=0.60",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tavily-python>=0.8.5",
    "httpx>=0.28.1",
    "trafilatura>=2.3.1",
]

[project.optional-dependencies]
dev = [
    "mutmut>=3.7,<4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
archgen = "archgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archgen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 90

[tool.mutmut]
source_paths = ["src/"]
only_mutate = ["src/archgen/retrieval/crawler.py"]
pytest_add_cli_args_test_selection = ["tests/test_crawler.py"]
also_copy = ["resources/", "try_research.py"]
